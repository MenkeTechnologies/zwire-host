[package]
name = "zwire-host"
version = "0.3.21"
edition = "2021"
description = "Universal local host: system stats, filesystem, exec, PTY, real-tmux control and kv store, over Chrome native-messaging or a Unix-socket JSON daemon"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/zwire-host"
homepage = "https://menketechnologies.github.io/zwire-host/"
documentation = "https://docs.rs/zwire-host"
readme = "README.md"
publish = true
keywords = ["native-messaging", "ipc", "pty", "sysinfo", "daemon"]
categories = ["command-line-utilities", "os"]

[lib]
name = "zwire_host"
path = "src/lib.rs"

[[bin]]
name = "zwire-host"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[features]
# The binary/daemon wants everything (default). Embedders that only need the
# light capabilities — filesystem crawl, exec, kv, bus, jobs, watch, via
# `zwire_host::api` — can set `default-features = false` to drop the heavy
# `sysinfo` and `portable-pty` dependencies entirely.
default = ["sysinfo-caps", "pty", "ztmux"]
# Live system stats (`sysinfo_*`), `ps`/`kill`, and sysinfo-derived host facts.
sysinfo-caps = ["dep:sysinfo"]
# Multiplexed PTY terminals (`pty_*`).
pty = ["dep:portable-pty"]
# REAL tmux (`tmux_*`) through the `ztmux-core` wire client — the live session
# tree, send-keys, capture, buffers, key tables and native session snapshots,
# reachable from a browser palette row. Unix only: the crate talks the tmux
# client protocol over a Unix domain socket, so the dependency is declared under
# `cfg(unix)` and the feature is inert on Windows.
ztmux = ["dep:ztmux-core"]
# A ready-made Tauri v2 plugin (`zwire_host::tauri_theme::init()`) giving an app
# fleet-wide theme sync: theme_get/theme_set commands + a `theme-changed` event.
# Only pulls `tauri` when an app opts in; the daemon build never does.
tauri = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
sysinfo = { version = "0.33", optional = true }
# ── file-browser ops (`fsx`) ──
# Content fingerprints for fs_hash / fs_compare_dirs / fs_find_duplicates.
sha2 = "0.10"
# Unified text diff for fs_diff (Myers / Patience).
similar = "2"
# Archive write (fs_compress) + read (fs_extract).
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# Cross-platform atime/mtime set for fs_touch.
filetime = "0.2"
# Recoverable delete (fs_move_to_trash) via the OS trash, not unlink.
trash = "5"
# Formats mtime/ctime as the `%Y-%m-%d %H:%M` the browser's date columns render.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
portable-pty = { version = "0.9.0", optional = true }
tauri = { version = "2", optional = true, default-features = false }

# The socket daemon uses native local IPC per platform: std Unix domain sockets
# on macOS/Linux (no dep), and named pipes via `interprocess` on Windows.
[target.'cfg(unix)'.dependencies]
# Extended attributes for fs_xattrs — Unix-only.
xattr = "1"
# REAL tmux (`tmux_*`, feature `ztmux`): the tmux client wire protocol over a Unix
# domain socket. No Windows counterpart exists, so the dependency is Unix-only.
ztmux-core = { version = "0.1.1", optional = true }

[target.'cfg(windows)'.dependencies]
interprocess = "2"

[dev-dependencies]
serde_json = "1"
# `fsx_ops` backdates a file to prove fs_touch really refreshes mtime.
filetime = "0.2"
